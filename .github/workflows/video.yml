name: Crear video
on:
  workflow_dispatch:
    inputs:
      historia:
        description: 'Archivo de la historia (ej. historias/lamborghini.json)'
        required: true
        default: 'historias/lamborghini.json'
      voz:
        description: 'Voz de Microsoft'
        required: true
        default: 'es-VE-SebastianNeural'
  push:
    paths: ['historias/*.json']

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          cd video && npm ci --silent && npx remotion browser ensure
      - name: Elegir historias
        id: h
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=${{ github.event.inputs.historia }}" >> $GITHUB_OUTPUT
          else
            echo "files=$(git diff --name-only HEAD~1 HEAD -- 'historias/*.json' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi
      - name: Crear videos
        env:
          EDGE_VOICE: ${{ github.event.inputs.voz || 'es-VE-SebastianNeural' }}
          CONCURRENCY: '1'
        run: |
          mkdir -p salida
          set -o pipefail
          for f in ${{ steps.h.outputs.files }}; do ./make.sh "$f" 2>&1 | tee -a salida/log.txt; done
      - name: Muestras de voces
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p salida/muestras
          for v in es-MX-JorgeNeural es-VE-SebastianNeural es-CO-GonzaloNeural es-US-AlonsoNeural es-AR-TomasNeural es-ES-AlvaroNeural; do
            edge-tts --voice $v --rate=+8% --text "Lamborghini existe por una pelea... y por un tractor. Italia, años sesenta. Ferruccio Lamborghini se había hecho millonario fabricando tractores." --write-media salida/muestras/$v.mp3
          done
      - name: Publicar resultados en la rama "salida"
        if: always()
        run: |
          mkdir -p salida/audio
          for d in video/public/*/; do [ "$d" != "video/public/fonts/" ] && cp -r "$d" salida/audio/ || true; done
          cp video/src/data/*.json salida/audio/ 2>/dev/null || true
          cd salida
          git init -q -b salida
          git add -A
          git -c user.name="bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Resultados ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" salida
