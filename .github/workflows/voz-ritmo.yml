name: Voz Ritmo
on:
  workflow_dispatch:
  push:
    paths: ['ritmo/guion.json']

permissions:
  contents: write

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generar voz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts==7.3.1
          python3 ritmo/voz.py ritmo/guion.json
      - name: Publicar en la rama "salida-ritmo"
        run: |
          cd ritmo/salida
          git init -q -b salida-ritmo
          git add -A
          git -c user.name="bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Voz Ritmo ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" salida-ritmo
