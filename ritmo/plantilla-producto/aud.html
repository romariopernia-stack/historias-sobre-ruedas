<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--o:#E9873F;--o2:#FFB45E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050404;font-family:'Inter',system-ui,sans-serif;color:#fff}
.abs{position:absolute}.full{position:absolute;inset:0}.c{left:0;right:0;text-align:center}
#vid,#vid2{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#detail{position:absolute;inset:0;overflow:hidden;display:none;background:radial-gradient(ellipse at 50% 45%,#2a1a10 0%,#0b0706 55%,#030202 90%)}
#prod{position:absolute;left:0;top:0;transform-origin:0 0}
#sweep{position:absolute;left:0;top:0;transform-origin:0 0;-webkit-mask-size:100% 100%;mix-blend-mode:screen;
  background:linear-gradient(105deg,rgba(255,180,110,0) 35%,rgba(255,200,140,.55) 50%,rgba(255,180,110,0) 65%);background-size:300% 100%}
#flash{background:#fff;opacity:0}
#sub.big{top:760px;font-size:118px;font-weight:900;font-style:normal;letter-spacing:-.04em;line-height:.95;text-transform:uppercase;text-shadow:0 4px 40px rgba(0,0,0,.85)}
#sub.big em{font-style:normal;color:var(--o2)}
#sub.word{top:1450px;font-size:150px;font-weight:900;font-style:normal;letter-spacing:-.03em;color:#fff;text-shadow:0 0 40px rgba(255,150,60,.6),0 4px 30px #000}
#sub{top:1600px;font-size:54px;font-weight:300;font-style:italic;color:#f2ece6;text-shadow:0 2px 24px #000,0 0 40px rgba(0,0,0,.9);padding:0 80px}
#grain{opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#wm{left:40px;top:60px;height:70px;opacity:.9}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(233,120,40,.5),rgba(233,120,40,.12) 35%,rgba(0,0,0,0) 65%)}
.pill{display:inline-block;padding:18px 44px;border-radius:70px;font-weight:800}
#end{display:none}
</style></head>
<body>
<div id="stage" class="full">
  <img id="vid2" src=""><img id="vid" src="">
  <div id="detail"><img id="prod" src=""><div id="sweep"></div></div>
  <div id="end" class="full">
    <div class="full" style="background:rgba(5,4,4,.82)"></div>
    <div class="glow" style="left:-200px;top:300px;width:1480px;height:1480px"></div>
    <div class="abs c" id="e_logo" style="top:520px"><img src="logo_s.png" style="width:500px;filter:drop-shadow(0 0 40px rgba(233,120,40,.6))"></div>
    <div class="abs c" id="e_t" style="top:1010px;font-size:60px;font-weight:300;font-style:italic">Vive la <b style="font-style:normal;font-weight:800;color:var(--o2)">experiencia</b></div>
    <div class="abs c" id="e_cta" style="top:1130px"><span class="pill" style="background:linear-gradient(90deg,#E9873F,#FFB45E);color:#1a0d04;font-size:46px">Comenta RESERVA 👇</span></div>
    <div class="abs c" id="e_url" style="top:1265px;font-size:38px;color:#ddd;font-weight:600">ritmovenezuela.com · @ritmo.ve</div>
  </div>
  <div id="sub" class="abs c"></div>
  <img id="wm" class="abs" src="logo_icon_s.png">
  <div id="grain" class="full"></div>
  <div id="flash" class="full"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let TL=null;const IMG={};
async function setSrc(el,src){if(el.getAttribute('src')!==src){el.src=src;await el.decode().catch(()=>{});}}
function frame(c,t){const local=(t-c.t0)*c.speed+c.start;const f=Math.min(c.n,Math.max(1,Math.floor(local*30)+1));return `${c.dir}/${String(f).padStart(4,'0')}.jpg`}
function anim(id,t,a,dy=40,dur=.4,scale=false){const p=eo(seg(t,a,a+dur));const e=$(id);e.style.opacity=p;
  e.style.transform=scale?`scale(${1.3-0.3*back(seg(t,a,a+dur))})`:`translateY(${(1-p)*dy}px)`;}
async function render(t){
  const cur=TL.shots.find(s=>t>=s.t0&&t<s.t1);
  const vid=$('vid'),vid2=$('vid2'),det=$('detail');
  vid.style.display=vid2.style.display='none';det.style.display='none';
  if(cur){
    const age=t-cur.t0, L=cur.t1-cur.t0, p=age/L;
    if(cur.kind==='detail'){
      det.style.display='block';
      const d=cur;const im=$('prod');await setSrc(im,d.img);
      const w0=im.naturalWidth,h0=im.naturalHeight;
      const z=(d.z0+(d.z1-d.z0)*eio(p))*Math.min(1080/w0,1920/h0);
      const fx=d.fx+(d.fx1-d.fx)*p, fy=d.fy+(d.fy1-d.fy)*p;
      const x=540-fx*w0*z, y=960-fy*h0*z;
      im.style.width=w0+'px';im.style.transform=`translate(${x}px,${y}px) scale(${z})`;
      const sw=$('sweep');sw.style.width=w0+'px';sw.style.height=h0+'px';sw.style.transform=im.style.transform;
      sw.style.webkitMaskImage=`url(${d.img})`;sw.style.backgroundPosition=`${100-p*100}% 0`;
      det.style.opacity=Math.min(1,age/0.12);
      im.style.filter=`brightness(${0.75+0.35*Math.sin(Math.PI*p)})`;
    } else {
      vid.style.display='block';await setSrc(vid,frame(cur,t));
      const z=(cur.z0??1.04)+((cur.z1??1.1)-(cur.z0??1.04))*p;vid.style.transform=`scale(${z})`;
      vid.style.opacity=1;vid.style.filter=cur.blur?`blur(${cur.blur}px) brightness(.7)`:'none';
      if(cur.xf&&age<cur.xf&&cur.prev!=null){const pv=TL.shots[cur.prev];
        if(pv.kind!=='detail'){vid2.style.display='block';await setSrc(vid2,frame(pv,t));vid2.style.transform=`scale(${pv.z1??1.1})`;vid2.style.filter=vid.style.filter;vid.style.opacity=eo(age/cur.xf);}}
    }
  }
  // end card
  const E=TL.seg.cierre;const inE=t>=E[0];$('end').style.display=inE?'block':'none';
  if(inE){anim('e_logo',t,E[0]+0.1,0,.55,true);anim('e_t',t,E[0]+0.9,30,.4);anim('e_cta',t,E[0]+1.4,0,.4,true);anim('e_url',t,E[0]+1.8,20,.4);
    $('e_cta').querySelector('.pill').style.transform=`scale(${1+0.04*Math.sin(t*8)})`;}
  $('wm').style.display=(!inE&&t>0.6)?'block':'none';
  // subtitles
  const sub=TL.subs.find(x=>t>=x[0]&&t<x[1]);const se=$('sub');
  if(sub&&!inE){se.className='abs c '+(sub[3]||'');se.innerHTML=sub[2];const p=seg(t,sub[0],sub[0]+0.45),q=seg(t,sub[1]-0.3,sub[1]);se.style.opacity=Math.min(p,1-q);se.style.transform=sub[3]?`scale(${1.25-0.25*back(seg(t,sub[0],sub[0]+0.3))})`:`translateY(${(1-eo(p))*14}px)`;if(sub[3])se.style.opacity=Math.min(cl(p*2.2),1-q);}else se.style.opacity=0;
  // flashes
  let fl=0;for(const h of TL.hits){const d=t-h[0];if(d>=0&&d<h[1])fl=Math.max(fl,(1-d/h[1])*h[2])}
  $('flash').style.opacity=fl;
  // fades
  $('stage').style.opacity=Math.min(seg(t,0,0.5),1-seg(t,TL.total-0.4,TL.total));
}
window.setTL=j=>{TL=j};window.render=render;
</script>
</body></html>
