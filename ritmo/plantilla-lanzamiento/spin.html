<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--o:#E9873F;--o2:#FFB45E;--r:#FF4D2E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050404;font-family:'Inter',system-ui,sans-serif;color:#fff}
.abs{position:absolute}
.full{position:absolute;inset:0}
.layer{position:absolute;inset:0;display:none;overflow:hidden}
.c{left:0;right:0;text-align:center}
.kick{font-size:32px;letter-spacing:.34em;font-weight:700;color:var(--o2)}
.huge{font-weight:900;letter-spacing:-.045em;line-height:.92}
#clip{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#tint{background:linear-gradient(180deg,rgba(233,120,40,.18),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(233,120,40,.22));mix-blend-mode:screen}
#shade{background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.75) 100%)}
#flash{background:#fff;opacity:0}
#grain{opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.word{position:absolute;left:0;right:0;text-align:center;top:1350px;font-size:150px;font-weight:900;letter-spacing:-.04em;
  color:transparent;-webkit-text-stroke:4px #fff;text-shadow:0 0 40px rgba(255,170,80,.6)}
.word.fill{color:#fff;-webkit-text-stroke:0}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(233,120,40,.55),rgba(233,120,40,.15) 35%,rgba(0,0,0,0) 65%)}
#wm{left:40px;top:60px;height:70px;opacity:.9}
.pill{display:inline-block;padding:18px 44px;border-radius:70px;font-weight:800}
.bar{position:absolute;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--o),var(--o2));box-shadow:0 0 30px var(--o)}
</style></head>
<body>
<div id="stage" class="full">
  <!-- video layer -->
  <img id="clip2" src="" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover"><img id="clip" src="">
  <div id="tint" class="full"></div>
  <div id="shade" class="full"></div>

  <!-- GANCHO -->
  <div id="L_gancho" class="layer">
    <div class="glow" id="g_glow" style="left:-160px;top:500px;width:1400px;height:1400px"></div>
    <div class="abs c" id="g_t1" style="top:880px;font-size:76px;font-weight:300;letter-spacing:.02em;color:#eee;font-style:italic">Apaga las luces<span id="g_dots">…</span></div>
  </div>

  <!-- MONTAJE words -->
  <div id="L_montaje" class="layer">
    
    <div class="word" id="w0">PEDAL</div>
    <div class="word" id="w1">LATIDO</div>
    <div class="word fill" id="w2" style="color:var(--o2)">ENERGÍA</div>
  </div>

  <!-- REVELA -->
  <div id="L_revela" class="layer">
    <div class="full" style="background:rgba(5,4,4,.72)"></div>
    <div class="glow" id="r_glow" style="left:-260px;top:360px;width:1600px;height:1600px"></div>
    <div class="abs c" id="r_logos" style="top:520px;display:flex;align-items:center;justify-content:center;gap:34px">
      <img src="logo_icon_s.png" style="height:120px">
      <span style="font-size:60px;font-weight:300;color:#aaa">×</span>
      <span style="font-size:58px;font-weight:900;font-style:italic;letter-spacing:-.02em">XTREME<span style="color:var(--o2)">·</span>BIKE</span>
    </div>
    <div class="abs c kick" id="r_k" style="top:720px">RITMO EXPERIENCE</div>
    <div class="abs c huge" id="r_t1" style="top:790px;font-size:210px;font-style:italic">XTREME</div>
    <div class="abs c huge" id="r_t2" style="top:985px;font-size:210px;font-style:italic">BIKE</div>
    <div class="abs c huge" id="r_t3" style="top:1190px;font-size:128px;color:var(--o2);text-shadow:0 0 50px rgba(255,150,60,.7)">INMERSIVO</div>
    <div class="bar" id="r_bar" style="left:240px;top:1360px;width:600px"></div>
  </div>

  <!-- JOHAN -->
  <div id="L_johan" class="layer">
    <img id="j_img" src="johan_crop.jpg" class="abs" style="left:-40px;top:0;width:1160px">
    <div class="full" style="background:linear-gradient(180deg,rgba(5,4,4,.0) 0%,rgba(5,4,4,0) 55%,rgba(5,4,4,.92) 72%,#050404 80%)"></div>
    <div class="abs c kick" id="j_k" style="top:1450px">JUNTO AL INSTRUCTOR</div>
    <div class="abs c huge" id="j_t" style="top:1515px;font-size:150px">JOHAN <span style="color:var(--o2)">PÉREZ</span></div>
  </div>

  <!-- SALA -->
  <div id="L_sala" class="layer">
    <img id="s_img" src="sala2_d.jpg" class="abs" style="left:-60px;top:-110px;width:1200px">
    <div class="full" style="background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 30%,rgba(0,0,0,.75) 85%)"></div>
    <div class="abs c kick" id="s_k" style="top:760px;text-shadow:0 2px 20px #000">EN LA SALA</div>
    <div class="abs c huge" id="s_t" style="top:820px;font-size:220px;color:#fff;
      text-shadow:0 0 10px #ff6a3d,0 0 30px #ff4d2e,0 0 70px #ff4d2e,0 0 120px rgba(255,77,46,.7);letter-spacing:.02em">LATHIR</div>
  </div>

  <!-- FECHA -->
  <div id="L_fecha" class="layer">
    <div class="full" style="background:rgba(5,4,4,.78)"></div>
    <div class="glow" style="left:-200px;top:420px;width:1480px;height:1480px"></div>
    <div class="abs c kick" id="f_k" style="top:560px">ESTRENO</div>
    <div class="abs c huge" id="f_d1" style="top:630px;font-size:120px">LUNES</div>
    <div class="abs c huge" id="f_d2" style="top:760px;font-size:300px;color:var(--o2);text-shadow:0 0 60px rgba(255,150,60,.6)">02</div>
    <div class="abs c huge" id="f_d3" style="top:1060px;font-size:120px">NOVIEMBRE</div>
    <div class="abs c" id="f_d4" style="top:1230px"><span class="pill" style="background:#fff;color:#111;font-size:54px">8:00 PM · LATHIR</span></div>
  </div>

  <!-- CIERRE -->
  <div id="L_cierre" class="layer">
    <div class="full" style="background:rgba(5,4,4,.86)"></div>
    <div class="glow" style="left:-200px;top:300px;width:1480px;height:1480px"></div>
    <div class="abs c" id="c_p" style="top:420px"><span class="pill" style="border:3px solid var(--o2);color:var(--o2);font-size:40px;letter-spacing:.08em">⚡ CUPOS LIMITADOS</span></div>
    <div class="abs c" id="c_logo" style="top:590px"><img src="logo_s.png" style="width:470px;filter:drop-shadow(0 0 40px rgba(233,120,40,.6))"></div>
    <div class="abs c" id="c_t" style="top:1060px;font-size:56px;font-weight:800;letter-spacing:-.02em">XtremeBike <span style="color:var(--o2)">Inmersivo</span></div>
    <div class="abs c" id="c_cta" style="top:1170px"><span class="pill" style="background:linear-gradient(90deg,#E9873F,#FFB45E);color:#1a0d04;font-size:44px">Comenta RESERVA 👇</span></div>
    <div class="abs c" id="c_url" style="top:1300px;font-size:38px;color:#ddd;font-weight:600">ritmovenezuela.com · @ritmo.ve</div>
  </div>

  <div id="sub" class="abs c" style="top:1560px;font-size:54px;font-weight:300;font-style:italic;color:#f2ece6;text-shadow:0 2px 24px #000,0 0 40px rgba(0,0,0,.9);padding:0 80px"></div>
  <img id="wm" class="abs" src="logo_icon_s.png">
  <div id="grain" class="full"></div>
  <div id="flash" class="full"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let TL=null;
function show(id,on){$(id).style.display=on?'block':'none'}
function anim(id,t,a,dy=50,dur=.35,scale=false){const p=eo(seg(t,a,a+dur));const e=$(id);e.style.opacity=p;
  e.style.transform=scale?`scale(${1.35-0.35*back(seg(t,a,a+dur))})`:`translateY(${(1-p)*dy}px)`;}

// returns {src, zoom} for clip at time t based on cut list
function clipAt(t){
  const cuts=TL.cuts;let c=null;
  for(const k of cuts){if(t>=k.t0&&t<k.t1){c=k;break}}
  if(!c)return null;
  return frameOf(c,t);
}
function frameOf(c,t){
  const local=(t-c.t0)*c.speed+c.start;
  const f=Math.min(c.n,Math.max(1,Math.floor(local*30)+1));
  const age=t-c.t0;
  const zoom=1.04+0.06*age/(c.t1-c.t0+0.4);
  return {src:`${c.dir||'cf'}/${c.clip}/${String(f).padStart(4,'0')}.jpg`,zoom,age,blur:c.blur||0,op:c.op??1,xf:c.xf||0,prev:c.prev};
}

async function render(t){
  const S=TL.seg;
  const inS=k=>t>=S[k][0]&&t<S[k][1];
  // video layer
  const c=clipAt(t);
  const img=$('clip');
  if(c){
    if(img.getAttribute('src')!==c.src){img.src=c.src;await img.decode().catch(()=>{});}
    img.style.display='block';img.style.opacity=c.op;
    img.style.transform=`scale(${c.zoom})`;
    img.style.filter=c.blur?`blur(${c.blur}px) brightness(.8)`:'none';
    const img2=$('clip2');
    if(c.xf&&c.age<c.xf&&c.prev!=null){const pc=frameOf(TL.cuts[c.prev],t);
      if(img2.getAttribute('src')!==pc.src){img2.src=pc.src;await img2.decode().catch(()=>{});}
      img2.style.display='block';img2.style.transform=`scale(${pc.zoom})`;img2.style.filter=img.style.filter;img.style.opacity=c.op*eo(c.age/c.xf);
    } else img2.style.display='none';
  } else {img.style.display='none';$('clip2').style.display='none';}
  $('tint').style.display=$('shade').style.display=c?'block':'none';
  // flash on cuts
  let fl=0;for(const k of TL.cuts){if(k.flash){const d=t-k.t0;if(d>=0&&d<0.12)fl=Math.max(fl,(1-d/0.12)*k.flash)}}
  for(const h of TL.hits){const d=t-h;if(d>=0&&d<0.25)fl=Math.max(fl,(1-d/0.25)*0.85)}
  $('flash').style.opacity=fl;

  // layers
  for(const k of ['gancho','montaje','revela','johan','sala','fecha','cierre'])show('L_'+k,S[k]&&inS(k));
  $('wm').style.display=(inS('intro')||inS('montaje')||inS('johan')||inS('sala'))?'block':'none';
  const sub=TL.subs.find(x=>t>=x[0]&&t<x[1]);const se=$('sub');
  if(sub){se.textContent=sub[2];const p=seg(t,sub[0],sub[0]+0.5),q=seg(t,sub[1]-0.35,sub[1]);se.style.opacity=Math.min(p,1-q);se.style.transform=`translateY(${(1-eo(p))*16}px)`}else se.style.opacity=0;

  if(inS('gancho')){const a=S.gancho[0];
    $('g_glow').style.opacity=0.25+0.25*Math.max(0,Math.sin(t*Math.PI*2));
    const p=eo(seg(t,a+0.3,a+1.3)),q=seg(t,S.gancho[1]-0.6,S.gancho[1]);$('g_t1').style.opacity=Math.min(p,1-q);
    $('g_t1').style.filter=`blur(${(1-p)*12+q*14}px)`;$('g_t1').style.letterSpacing=(0.02+0.06*seg(t,a,S.gancho[1]))+'em';}
  if(inS('montaje')){const a=S.montaje[0];
    TL.words.forEach((w,i)=>{const e=$('w'+i);const on=t>=w[0]&&t<w[1];e.style.display=on?'block':'none';
      if(on){const p=eo(seg(t,w[0],w[0]+0.5)),q=seg(t,w[1]-0.3,w[1]);e.style.transform=`scale(${1.08-0.08*p})`;e.style.opacity=Math.min(p,1-q);e.style.filter=`blur(${(1-p)*10}px)`}});}
  if(inS('revela')){const a=S.revela[0];
    $('r_glow').style.opacity=0.7+0.3*Math.sin(t*6);
    anim('r_logos',t,a+0.05,30,.35);anim('r_k',t,a+0.2,20,.3);
    anim('r_t1',t,a+0.3,0,.3,true);anim('r_t2',t,a+0.45,0,.3,true);anim('r_t3',t,a+0.65,0,.35,true);
    const b=eo(seg(t,a+0.8,a+1.2));$('r_bar').style.transform=`scaleX(${b})`;}
  if(inS('johan')){const a=S.johan[0],b=S.johan[1];const p=seg(t,a,b);
    $('j_img').style.transform=`scale(${1.12-0.08*p}) translateY(${-20*p}px)`;
    $('L_johan').style.opacity=eo(seg(t,a,a+0.25));
    anim('j_k',t,a+0.15,20,.3);anim('j_t',t,a+0.3,0,.35,true);}
  if(inS('sala')){const a=S.sala[0],b=S.sala[1];const p=seg(t,a,b);
    $('s_img').style.transform=`scale(${1.0+0.1*p})`;
    anim('s_k',t,a+0.1,20,.3);
    const fl2=(t-a<0.6)?(Math.sin((t-a)*60)>0?1:0.25):(0.92+0.08*Math.sin(t*40));
    anim('s_t',t,a+0.2,0,.3,true);$('s_t').style.opacity*=fl2;}
  if(inS('fecha')){const a=S.fecha[0];
    anim('f_k',t,a+0.05,20,.3);anim('f_d1',t,a+0.15,40,.3);anim('f_d2',t,a+0.3,0,.35,true);anim('f_d3',t,a+0.5,40,.3);anim('f_d4',t,a+0.75,0,.35,true);}
  if(inS('cierre')){const a=S.cierre[0];
    anim('c_p',t,a+0.05,20,.3);anim('c_logo',t,a+0.15,0,.45,true);anim('c_t',t,a+0.5,30,.3);anim('c_cta',t,a+0.7,0,.35,true);anim('c_url',t,a+0.95,20,.3);
    const pulse=1+0.04*Math.sin(t*8);$('c_cta').querySelector('.pill').style.transform=`scale(${pulse})`;}
  // global fade out
  const end=TL.total;$('stage').style.opacity=1-seg(t,end-0.35,end);
}
window.setTL=j=>{TL=j};
window.render=render;
</script>
</body></html>
